<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 140" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#070A14" />
    </linearGradient>

    <linearGradient id="pipeBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.3" />
    </linearGradient>

    <!-- Animated Connecting Track Line -->
    <linearGradient id="beamLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF">
        <animate attributeName="stop-color" values="#00E5FF;#6366F1;#A855F7;#00E5FF" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#6366F1">
        <animate attributeName="stop-color" values="#6366F1;#A855F7;#00E5FF;#6366F1" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#A855F7">
        <animate attributeName="stop-color" values="#A855F7;#00E5FF;#6366F1;#A855F7" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <style>
    .wf-title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #FFFFFF; }
    .wf-sub { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 10px; fill: #94A3B8; }
    .wf-num { font-family: 'Fira Code', monospace; font-size: 9px; font-weight: 700; }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="956" height="136" rx="16" ry="16" fill="url(#pipeBg)" stroke="url(#pipeBorder)" stroke-width="1.5" />

  <!-- Animated Connection Track -->
  <line x1="80" y1="52" x2="880" y2="52" stroke="#1E293B" stroke-width="3" stroke-linecap="round" />
  <line x1="80" y1="52" x2="880" y2="52" stroke="url(#beamLine)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="12 18">
    <animate attributeName="stroke-dashoffset" values="60;0" dur="4s" repeatCount="indefinite" />
  </line>

  <!-- Node 1: Discover -->
  <g transform="translate(80, 52)">
    <circle cx="0" cy="0" r="18" fill="#0F172A" stroke="#00E5FF" stroke-width="2" />
    <text x="0" y="5" text-anchor="middle" font-size="14">💡</text>
    <text x="0" y="34" text-anchor="middle" class="wf-title">1. Discover</text>
    <text x="0" y="48" text-anchor="middle" class="wf-sub">Problem Decomp</text>
  </g>

  <!-- Node 2: Architecture -->
  <g transform="translate(240, 52)">
    <circle cx="0" cy="0" r="18" fill="#0F172A" stroke="#38BDF8" stroke-width="2" />
    <text x="0" y="5" text-anchor="middle" font-size="14">🧩</text>
    <text x="0" y="34" text-anchor="middle" class="wf-title">2. Architecture</text>
    <text x="0" y="48" text-anchor="middle" class="wf-sub">Data &amp; API Design</text>
  </g>

  <!-- Node 3: Build -->
  <g transform="translate(400, 52)">
    <circle cx="0" cy="0" r="18" fill="#0F172A" stroke="#6366F1" stroke-width="2" />
    <text x="0" y="5" text-anchor="middle" font-size="14">💻</text>
    <text x="0" y="34" text-anchor="middle" class="wf-title">3. Build</text>
    <text x="0" y="48" text-anchor="middle" class="wf-sub">Next.js &amp; Supabase</text>
  </g>

  <!-- Node 4: Validate -->
  <g transform="translate(560, 52)">
    <circle cx="0" cy="0" r="18" fill="#0F172A" stroke="#818CF8" stroke-width="2" />
    <text x="0" y="5" text-anchor="middle" font-size="14">🧪</text>
    <text x="0" y="34" text-anchor="middle" class="wf-title">4. Validate</text>
    <text x="0" y="48" text-anchor="middle" class="wf-sub">Tests &amp; Quality</text>
  </g>

  <!-- Node 5: Deploy -->
  <g transform="translate(720, 52)">
    <circle cx="0" cy="0" r="18" fill="#0F172A" stroke="#A855F7" stroke-width="2" />
    <text x="0" y="5" text-anchor="middle" font-size="14">🚀</text>
    <text x="0" y="34" text-anchor="middle" class="wf-title">5. Deploy</text>
    <text x="0" y="48" text-anchor="middle" class="wf-sub">Vercel &amp; Edge</text>
  </g>

  <!-- Node 6: Iterate -->
  <g transform="translate(880, 52)">
    <circle cx="0" cy="0" r="18" fill="#0F172A" stroke="#10B981" stroke-width="2" />
    <text x="0" y="5" text-anchor="middle" font-size="14">🔁</text>
    <text x="0" y="34" text-anchor="middle" class="wf-title">6. Iterate</text>
    <text x="0" y="48" text-anchor="middle" class="wf-sub">Telemetry &amp; Scale</text>
  </g>
</svg>
