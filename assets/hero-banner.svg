<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <!-- Dark Cyber Gradient Background -->
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A14" />
      <stop offset="40%" stop-color="#0B132B" />
      <stop offset="80%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090D18" />
    </linearGradient>

    <!-- Animated Sweep Gradient for Wave / Border -->
    <linearGradient id="heroBorderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF">
        <animate attributeName="stop-color" values="#00E5FF;#6366F1;#A855F7;#00E5FF" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#6366F1">
        <animate attributeName="stop-color" values="#6366F1;#A855F7;#00E5FF;#6366F1" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#A855F7">
        <animate attributeName="stop-color" values="#A855F7;#00E5FF;#6366F1;#A855F7" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Radial Glows for Lighting Depth -->
    <radialGradient id="cyanCore" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleCore" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="heroGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#38BDF8" stroke-width="0.75" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <style>
    .font-hero { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 900; }
    .font-sub { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 600; }
    .font-mono { font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace; }
  </style>

  <!-- Base Background -->
  <rect x="2" y="2" width="996" height="236" rx="20" ry="20" fill="url(#heroBg)" stroke="url(#heroBorderGlow)" stroke-width="2" />
  
  <!-- Ambient Radiance & Grid -->
  <rect x="2" y="2" width="996" height="236" rx="20" ry="20" fill="url(#cyanCore)" />
  <rect x="2" y="2" width="996" height="236" rx="20" ry="20" fill="url(#purpleCore)" />
  <rect x="2" y="2" width="996" height="236" rx="20" ry="20" fill="url(#heroGrid)" />

  <!-- Animated Wave Line Across Background -->
  <path d="M 0 170 Q 250 120 500 170 T 1000 160" fill="none" stroke="url(#heroBorderGlow)" stroke-width="1.8" stroke-opacity="0.4">
    <animate attributeName="d" values="M 0 170 Q 250 120 500 170 T 1000 160; M 0 160 Q 250 190 500 150 T 1000 170; M 0 170 Q 250 120 500 170 T 1000 160" dur="10s" repeatCount="indefinite" />
  </path>

  <!-- Subtle Floating Particles -->
  <g opacity="0.8">
    <circle cx="210" cy="45" r="2" fill="#00E5FF">
      <animate attributeName="cy" values="45;38;45" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="780" cy="50" r="2.5" fill="#A855F7">
      <animate attributeName="cy" values="50;42;50" dur="4.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="890" cy="180" r="2" fill="#38BDF8">
      <animate attributeName="cy" values="180;172;180" dur="3.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Left Code Bracket Accent (Tech Decorative) -->
  <g transform="translate(60, 48)" opacity="0.35">
    <path d="M 30 10 L 10 35 L 30 60" fill="none" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" />
  </g>
  <!-- Right Code Bracket Accent (Tech Decorative) -->
  <g transform="translate(900, 130)" opacity="0.35">
    <path d="M 10 10 L 30 35 L 10 60" fill="none" stroke="#A855F7" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Top Pill / Status Tag -->
  <g transform="translate(360, 26)">
    <rect x="0" y="0" width="280" height="26" rx="13" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <circle cx="16" cy="13" r="4.5" fill="#10B981" />
    <circle cx="16" cy="13" r="7" fill="none" stroke="#10B981" stroke-width="1.2" opacity="0.6">
      <animate attributeName="r" values="5;11;5" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="17" class="font-mono" font-size="10.5" font-weight="600" fill="#34D399" letter-spacing="0.6">
      OPEN TO BUILD &amp; COLLABORATE
    </text>
  </g>

  <!-- Main Hero Heading -->
  <text x="500" y="108" class="font-hero" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    ELANGO S
  </text>

  <!-- Glowing Underline Accent -->
  <rect x="420" y="122" width="160" height="3" rx="1.5" fill="url(#heroBorderGlow)" />

  <!-- Role Identity Line -->
  <text x="500" y="156" class="font-mono" font-size="13.5" font-weight="600" fill="#38BDF8" text-anchor="middle" letter-spacing="1.5">
    FULL-STACK DEVELOPER • PROMPT ENGINEER • AI EXPLORER
  </text>

  <!-- Core Philosophy / Subtitle -->
  <text x="500" y="188" class="font-sub" font-size="13" fill="#94A3B8" text-anchor="middle" letter-spacing="0.5">
    Building Scalable Web Systems, Applied AI Experiences &amp; Client Products
  </text>

  <!-- Bottom Mini Tech Dots -->
  <g transform="translate(390, 206)">
    <circle cx="20" cy="8" r="3" fill="#38BDF8" />
    <text x="28" y="11" class="font-mono" font-size="9.5" fill="#64748B">TypeScript</text>

    <circle cx="100" cy="8" r="3" fill="#818CF8" />
    <text x="108" y="11" class="font-mono" font-size="9.5" fill="#64748B">Next.js</text>

    <circle cx="170" cy="8" r="3" fill="#A855F7" />
    <text x="178" y="11" class="font-mono" font-size="9.5" fill="#64748B">Supabase</text>

    <circle cx="240" cy="8" r="3" fill="#10B981" />
    <text x="248" y="11" class="font-mono" font-size="9.5" fill="#64748B">AI / LLM</text>
  </g>

</svg>
