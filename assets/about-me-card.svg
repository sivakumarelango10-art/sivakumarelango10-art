<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C17" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0A0E1A" />
    </linearGradient>

    <!-- Animated Border Gradient -->
    <linearGradient id="animatedBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF">
        <animate attributeName="stop-color" values="#00E5FF;#6366F1;#A855F7;#00E5FF" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#6366F1">
        <animate attributeName="stop-color" values="#6366F1;#A855F7;#00E5FF;#6366F1" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#A855F7">
        <animate attributeName="stop-color" values="#A855F7;#00E5FF;#6366F1;#A855F7" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glowing Accent Radiance -->
    <radialGradient id="cyanGlow" cx="10%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow" cx="90%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>

    <!-- Divider Gradient -->
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#818CF8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.1" />
    </linearGradient>

    <!-- Item Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.4" />
    </linearGradient>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38BDF8" fill-opacity="0.08" />
    </pattern>
  </defs>

  <style>
    .font-title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
    .font-sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace; }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="956" height="376" rx="20" ry="20" fill="url(#bgGrad)" stroke="url(#animatedBorder)" stroke-width="2" />

  <!-- Ambient Light Overlays -->
  <rect x="2" y="2" width="956" height="376" rx="20" ry="20" fill="url(#cyanGlow)" />
  <rect x="2" y="2" width="956" height="376" rx="20" ry="20" fill="url(#purpleGlow)" />
  <rect x="2" y="2" width="956" height="376" rx="20" ry="20" fill="url(#dotGrid)" />

  <!-- Floating Ambient Particles (Subtle Animation) -->
  <g opacity="0.7">
    <circle cx="440" cy="65" r="2" fill="#00E5FF">
      <animate attributeName="cy" values="65;58;65" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="180" cy="330" r="2.5" fill="#818CF8">
      <animate attributeName="cy" values="330;322;330" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="910" cy="110" r="1.5" fill="#A855F7">
      <animate attributeName="cy" values="110;104;110" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ============================================================
       LEFT PANEL: IDENTITY & BRAND
  ============================================================ -->

  <!-- Status Pill -->
  <g transform="translate(42, 38)">
    <rect x="0" y="0" width="295" height="28" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    
    <!-- Pulsing Radar Indicator -->
    <circle cx="15" cy="14" r="4.5" fill="#10B981" />
    <circle cx="15" cy="14" r="7" fill="none" stroke="#10B981" stroke-width="1.2" opacity="0.6">
      <animate attributeName="r" values="5;11;5" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2.4s" repeatCount="indefinite" />
    </circle>

    <text x="28" y="18" class="font-mono" font-size="10.5" font-weight="600" fill="#34D399" letter-spacing="0.5">
      AVAILABLE TO BUILD • FULL-STACK &amp; AI
    </text>
  </g>

  <!-- Primary Name Heading -->
  <text x="42" y="112" class="font-title" font-size="38" fill="#FFFFFF" letter-spacing="0.5">
    ELANGO S
  </text>

  <!-- Role Subtitle Line -->
  <text x="42" y="138" class="font-mono" font-size="12" font-weight="600" fill="#38BDF8" letter-spacing="1.2">
    FULL-STACK DEVELOPER • PROMPT ENGINEER
  </text>

  <!-- Focus / Explorer Subline -->
  <text x="42" y="158" class="font-sans" font-size="12" font-weight="500" fill="#818CF8" letter-spacing="0.8">
    Applied AI Explorer • Real-World Product Builder
  </text>

  <!-- Tagline Quote -->
  <g transform="translate(42, 192)">
    <rect x="0" y="0" width="385" height="42" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
    <path d="M 0 0 L 3 0 L 3 42 L 0 42 Z" fill="#38BDF8" />
    <text x="14" y="25" class="font-sans" font-size="12" font-style="italic" fill="#94A3B8">
      "Building practical software at the intersection of code and AI."
    </text>
  </g>

  <!-- Tech Badges Strip -->
  <g transform="translate(42, 252)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="68" height="24" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.4" />
      <text x="34" y="16" class="font-mono" font-size="10" font-weight="600" fill="#E2E8F0" text-anchor="middle">React 19</text>
    </g>
    <g transform="translate(74, 0)">
      <rect x="0" y="0" width="76" height="24" rx="6" fill="#0F172A" stroke="#818CF8" stroke-width="0.8" stroke-opacity="0.4" />
      <text x="38" y="16" class="font-mono" font-size="10" font-weight="600" fill="#E2E8F0" text-anchor="middle">Next.js 16</text>
    </g>
    <g transform="translate(156, 0)">
      <rect x="0" y="0" width="84" height="24" rx="6" fill="#0F172A" stroke="#A855F7" stroke-width="0.8" stroke-opacity="0.4" />
      <text x="42" y="16" class="font-mono" font-size="10" font-weight="600" fill="#E2E8F0" text-anchor="middle">TypeScript</text>
    </g>
    <g transform="translate(246, 0)">
      <rect x="0" y="0" width="76" height="24" rx="6" fill="#0F172A" stroke="#00E5FF" stroke-width="0.8" stroke-opacity="0.4" />
      <text x="38" y="16" class="font-mono" font-size="10" font-weight="600" fill="#E2E8F0" text-anchor="middle">Supabase</text>
    </g>
    <g transform="translate(328, 0)">
      <rect x="0" y="0" width="68" height="24" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.4" />
      <text x="34" y="16" class="font-mono" font-size="10" font-weight="600" fill="#E2E8F0" text-anchor="middle">OpenAI</text>
    </g>
  </g>

  <!-- Interactive Terminal Line (Bottom-Left) -->
  <g transform="translate(42, 305)">
    <rect x="0" y="0" width="385" height="34" rx="6" fill="#050811" stroke="#1E293B" stroke-width="1" />
    <circle cx="14" cy="17" r="3.5" fill="#EF4444" />
    <circle cx="25" cy="17" r="3.5" fill="#F59E0B" />
    <circle cx="36" cy="17" r="3.5" fill="#10B981" />
    <text x="50" y="21" class="font-mono" font-size="11" fill="#64748B">&gt;</text>
    <text x="64" y="21" class="font-mono" font-size="11" fill="#38BDF8">elango</text>
    <text x="108" y="21" class="font-mono" font-size="11" fill="#94A3B8">.ship({ status: </text>
    <text x="206" y="21" class="font-mono" font-size="11" fill="#34D399">"production"</text>
    <text x="296" y="21" class="font-mono" font-size="11" fill="#94A3B8"> })</text>
    <!-- Blinking Cursor -->
    <rect x="312" y="10" width="6" height="14" fill="#38BDF8">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- ============================================================
       VERTICAL DIVIDER
  ============================================================ -->
  <line x1="455" y1="36" x2="455" y2="344" stroke="url(#dividerGrad)" stroke-width="1.5" />

  <!-- ============================================================
       RIGHT PANEL: PROFILE HIGHLIGHTS GRID (6 ITEMS)
  ============================================================ -->

  <!-- Item 1: Full-Stack -->
  <g transform="translate(480, 36)">
    <rect x="0" y="0" width="438" height="46" rx="8" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1" />
    <text x="16" y="28" font-size="16">💻</text>
    <text x="44" y="21" class="font-sans" font-size="12.5" font-weight="700" fill="#FFFFFF">
      Full-Stack Developer &amp; Software Builder
    </text>
    <text x="44" y="36" class="font-sans" font-size="10.5" fill="#94A3B8">
      End-to-end architectures • Modern Next.js &amp; React • REST APIs
    </text>
  </g>

  <!-- Item 2: Prompt Engineering -->
  <g transform="translate(480, 88)">
    <rect x="0" y="0" width="438" height="46" rx="8" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1" />
    <text x="16" y="28" font-size="16">🧠</text>
    <text x="44" y="21" class="font-sans" font-size="12.5" font-weight="700" fill="#FFFFFF">
      Prompt Engineer &amp; Applied AI Explorer
    </text>
    <text x="44" y="36" class="font-sans" font-size="10.5" fill="#94A3B8">
      Structured prompt templates • AST code parsing • OpenAI integrations
    </text>
  </g>

  <!-- Item 3: Education -->
  <g transform="translate(480, 140)">
    <rect x="0" y="0" width="438" height="46" rx="8" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1" />
    <text x="16" y="28" font-size="16">🎓</text>
    <text x="44" y="21" class="font-sans" font-size="12.5" font-weight="700" fill="#FFFFFF">
      B.Tech CSE (AI &amp; ML) @ Yenepoya University
    </text>
    <text x="44" y="36" class="font-sans" font-size="10.5" fill="#94A3B8">
      Deepening CS foundations, algorithms, system design &amp; AI systems
    </text>
  </g>

  <!-- Item 4: Real-World E-Commerce -->
  <g transform="translate(480, 192)">
    <rect x="0" y="0" width="438" height="46" rx="8" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1" />
    <text x="16" y="28" font-size="16">🛍️</text>
    <text x="44" y="21" class="font-sans" font-size="12.5" font-weight="700" fill="#FFFFFF">
      Real-World Client E-Commerce Builder
    </text>
    <text x="44" y="36" class="font-sans" font-size="10.5" fill="#38BDF8">
      Production fashion storefront: ZYRØCORE (Next.js, Supabase, Razorpay)
    </text>
  </g>

  <!-- Item 5: Hackathons -->
  <g transform="translate(480, 244)">
    <rect x="0" y="0" width="438" height="46" rx="8" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1" />
    <text x="16" y="28" font-size="16">🚀</text>
    <text x="44" y="21" class="font-sans" font-size="12.5" font-weight="700" fill="#FFFFFF">
      Hackathon Builder &amp; Rapid Prototyper
    </text>
    <text x="44" y="36" class="font-sans" font-size="10.5" fill="#94A3B8">
      Fast-paced sprints • Turning requirements into working software
    </text>
  </g>

  <!-- Item 6: Philosophy & Practical Impact -->
  <g transform="translate(480, 296)">
    <rect x="0" y="0" width="438" height="46" rx="8" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1" />
    <text x="16" y="28" font-size="16">🛠️</text>
    <text x="44" y="21" class="font-sans" font-size="12.5" font-weight="700" fill="#FFFFFF">
      Practical Digital Product Engineering
    </text>
    <text x="44" y="36" class="font-sans" font-size="10.5" fill="#34D399">
      Build ➔ Experiment ➔ Learn ➔ Ship ➔ Improve
    </text>
  </g>

</svg>
