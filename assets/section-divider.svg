<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" width="100%" height="24">
  <defs>
    <linearGradient id="dividerGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0" />
      <stop offset="25%" stop-color="#00E5FF" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#00E5FF;#6366F1;#A855F7;#00E5FF" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="1">
        <animate attributeName="stop-color" values="#6366F1;#A855F7;#00E5FF;#6366F1" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="75%" stop-color="#A855F7" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#A855F7;#00E5FF;#6366F1;#A855F7" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="centerOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Central Glow Line -->
  <line x1="50" y1="12" x2="950" y2="12" stroke="url(#dividerGlow)" stroke-width="2" stroke-linecap="round" />
  
  <!-- Subtle Ambient Glow -->
  <line x1="150" y1="12" x2="850" y2="12" stroke="url(#dividerGlow)" stroke-width="6" stroke-opacity="0.25" stroke-linecap="round" />

  <!-- Center Diamond Accent -->
  <g transform="translate(500, 12)">
    <circle cx="0" cy="0" r="10" fill="url(#centerOrb)">
      <animate attributeName="r" values="8;13;8" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite" />
    </circle>
    <polygon points="0,-4 4,0 0,4 -4,0" fill="#FFFFFF" />
  </g>
</svg>
